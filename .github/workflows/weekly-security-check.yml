name: Weekly Security Check

# 週一回のセキュリティ健全性チェック。
# - system-security-rollback スキルのセルフテスト(構文/マニフェスト/必須ファイル)
# - リポジトリの簡易シークレットスキャン(誤コミットされた鍵・認証情報の検出)
# エフェメラルな実環境ではローカル cron が永続しないため、確実に発火する
# GitHub Actions の schedule で週次実行する。

on:
  schedule:
    # 毎週月曜 00:00 UTC (= 月曜 09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rollback skill self-test
        run: |
          bash .claude/skills/system-security-rollback/rollback.sh selftest

      - name: ShellCheck rollback script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning .claude/skills/system-security-rollback/rollback.sh || true

      - name: Secret scan
        run: |
          echo "=== 簡易シークレットスキャン ==="
          # よくある認証情報パターンを検出。.git は除外。
          patterns='(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY-----|aws_secret_access_key|password\s*=\s*["'"'"'][^"'"'"']{6,}|api[_-]?key\s*[:=]\s*["'"'"'][^"'"'"']{12,})'
          if grep -rEnI --exclude-dir=.git --exclude-dir=node_modules --exclude=weekly-security-check.yml "$patterns" . ; then
            echo "::error::潜在的なシークレットが検出されました。確認してください。"
            exit 1
          else
            echo "✅ シークレットは検出されませんでした。"
          fi

      - name: Summary
        if: always()
        run: echo "週次セキュリティチェック完了。詳細は各ステップのログを参照してください。"
